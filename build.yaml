# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command, `snippet` to add a Zephyr snippet, and
# `artifact-name` to assign a name to distinguish build outputs from each other:
#
# board: [ "nice_nano" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano
#     shield: reviung41
#   - board: nice_nano
#     shield: corne_left
#     snippet: studio-rpc-usb-uart
#     cmake-args: -DCONFIG_ZMK_STUDIO=y
#     artifact-name: corne_left_with_studio
#
---
# System_Reset branch: builds ONLY the settings_reset wipe firmware
# (https://zmk.dev/docs/config/settings). Flash the resulting UF2 once to erase
# all persistent settings (BLE bonds, Studio keymap NVS, output selection,
# RGB), then re-flash the normal firmware built from main. Keep this entry
# BARE - no snippet/cmake-args: the A45 Studio flags (-DCONFIG_ZMK_STUDIO=y)
# trip the physical_layouts.c static assert on this shield (it has no
# zmk,physical_layout node; Attempt 50 CI failure). The normal keyboard build
# lives on main's build.yaml, not here.
include:
  - board: nice_nano_v2
    shield: settings_reset
