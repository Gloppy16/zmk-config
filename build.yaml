# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command, `snippet` to add a Zephyr snippet, and
# `artifact-name` to assign a name to distinguish build outputs from each other:
#
# board: [ "nice_nano" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano
#     shield: reviung41
#   - board: nice_nano
#     shield: corne_left
#     snippet: studio-rpc-usb-uart
#     cmake-args: -DCONFIG_ZMK_STUDIO=y
#     artifact-name: corne_left_with_studio
#
---
include:
  - board: nice_nano_v2
    shield: cocot64_plus
  - board: nice_nano_v2
    shield: settings_reset
    # Attempt 45: ZMK Studio RPC endpoint (CDC ACM #2, chosen
    # zmk,studio-rpc-uart) + CONFIG_ZMK_STUDIO=y. Attempt 34's logging console
    # is KEPT: the two snippets touch disjoint chosen properties
    # (zephyr,console vs zmk,studio-rpc-uart) and create SEPARATE CDC nodes
    # under zephyr_udc0 (verified vs v0.3.0 app/snippets/), so picocom bench
    # logging survives. Both names ride the workflow's single -S arg; west
    # -S is action=append and Zephyr 3.5 snippets.cmake splits SNIPPET on
    # spaces, so the space-separated string yields both snippets.
    snippet: studio-rpc-usb-uart zmk-usb-logging
    cmake-args: -DCONFIG_ZMK_STUDIO=y
