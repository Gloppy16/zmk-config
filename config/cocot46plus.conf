# Trackball driver (bit-banged ADNS-5050) [31]
CONFIG_GPIO=y
CONFIG_INPUT=y
CONFIG_ADNS5050=y

# Mouse keys / pointing device support
CONFIG_ZMK_POINTING=y

# Underglow
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

# OLED (uncomment along with the overlay block if installed)
# CONFIG_ZMK_DISPLAY is not set
# CONFIG_SSD1306 is not set
