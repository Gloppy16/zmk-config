# Trackball driver (bit-banged ADNS-5050) [31]
CONFIG_GPIO=y
CONFIG_INPUT=y
CONFIG_ADNS5050=y

# Mouse keys / pointing device support
CONFIG_ZMK_POINTING=y

# Underglow
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
# Attempt 38: keep the rail on at idle. Agen runs USB power with a physical
# battery disconnect switch, so software rail-cutting is unwanted - stop the
# ~30s idle dropout cycle on the sensor/OLED rail (P0.13). Set in BOTH conf
# files (shield+user merge lesson).
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=n

# OLED display (SSD1306 on Pro Micro I2C) — enabled as of Attempt 30
CONFIG_ZMK_DISPLAY=y
CONFIG_SSD1306=y

# USB CDC ACM logging (Attempt 34): boot log output on /dev/ttyACM*, 115200 8N1.
# Backup for the zmk-usb-logging snippet in build.yaml - conf files merge
# shield+user, so this holds even if the snippet decays.
CONFIG_ZMK_USB_LOGGING=y

# Attempt 35: floor the global log ceiling at DBG. Per-module levels
# (ZMK_LOG_LEVEL=4, ADNS5050_LOG_LEVEL=3) still decide what each module
# emits; this only raises the ceiling. Set in BOTH conf files (shield+user
# merge lesson) - the zmk-usb-logging snippet merges last, but it only
# sets CONFIG_ZMK_USB_LOGGING (verified vs v0.3.0), so this sticks.
CONFIG_LOG_DEFAULT_LEVEL=4

# Attempt 45: ZMK Studio. Symbol verified vs v0.3.0 app/src/studio/Kconfig
# (menuconfig ZMK_STUDIO; selects ZMK_STUDIO_RPC -> NANOPB, SETTINGS,
# ZMK_KEYMAP_SETTINGS_STORAGE etc.). Set in BOTH conf files (merge lesson);
# also passed via build.yaml cmake-args like the docs' example.
CONFIG_ZMK_STUDIO=y

# Attempt 45: no locking. In-tree pattern (minivan_studio_tester.conf:1):
# our keymap has no &studio_unlock key (and keymap content is frozen for
# Studio per docs - once Studio manages the keymap, .keymap edits stop
# applying), so a locked default would leave no physical unlock path.
# Unlock requests exist ONLY as a physical binding in v0.3.0 (no RPC
# unlock); with locking off the keyboard is always unlocked.
CONFIG_ZMK_STUDIO_LOCKING=n

# Attempt 47: bench instrumentation for the X-axis stutter investigation.
# Default OFF - flip to =y (BOTH conf files) for the raw-delta bench capture,
# then flip back. Logs "raw dx=<n> dy=<n>" ~every 64ms while moving.
# CONFIG_ADNS5050_DEBUG_DELTAS=n
