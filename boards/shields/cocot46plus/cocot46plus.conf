# Trackball driver (bit-banged ADNS-5050) [31]
CONFIG_GPIO=y
CONFIG_INPUT=y
CONFIG_ADNS5050=y

# Mouse keys / pointing device support
CONFIG_ZMK_POINTING=y

# Underglow
CONFIG_ZMK_RGB_UNDERGLOW=y
# Attempt 52: Zephyr 4.1 split the monolithic WS2812_STRIP symbol into
# per-transport variants (WS2812_STRIP_SPI/_I2S/_GPIO), each DT-gated and
# default-y. Our strip is worldsemi,ws2812-spi on spi3, so the SPI variant
# is the correct one (old WS2812_STRIP no longer exists - would warn+ignore).
CONFIG_WS2812_STRIP_SPI=y
# Attempt 38: keep the rail on at idle. Agen runs USB power with a physical
# battery disconnect switch, so software rail-cutting is unwanted - stop the
# ~30s idle dropout cycle on the sensor/OLED rail (P0.13). Set in BOTH conf
# files (shield+user merge lesson).
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=n

# OLED display (SSD1306 on Pro Micro I2C) — enabled as of Attempt 30
CONFIG_ZMK_DISPLAY=y
CONFIG_SSD1306=y

# USB CDC ACM logging (Attempt 34): boot log output on /dev/ttyACM*, 115200 8N1.
# Backup for the zmk-usb-logging snippet in build.yaml - conf files merge
# shield+user, so this holds even if the snippet decays.
CONFIG_ZMK_USB_LOGGING=y

# Attempt 58: LOG_DEFAULT_LEVEL=3 (INF). Attempt 35's DBG floor (level 4)
# starved BLE SMP timing during Security-Manager pairing — the DBG flood kept
# the host stack from hitting SMP deadlines, so the controller killed the link
# with 0x08 supervision timeout right after the host pubkey (btmon-proven:
# A51/A55 fail at level 4, A56/A57 pair at level 3). ERR/WAR/INF logging stays
# (USB logging and OLED i2c diagnostics are ERR level and remain visible).
# Set in BOTH conf files (shield+user merge lesson).
CONFIG_LOG_DEFAULT_LEVEL=3

# Attempt 45: ZMK Studio. Symbol verified vs v0.3.0 app/src/studio/Kconfig
# (menuconfig ZMK_STUDIO; selects ZMK_STUDIO_RPC -> NANOPB, SETTINGS,
# ZMK_KEYMAP_SETTINGS_STORAGE etc.). Set in BOTH conf files (merge lesson);
# also passed via build.yaml cmake-args like the docs' example.
CONFIG_ZMK_STUDIO=y

# Attempt 45: no locking. In-tree pattern (minivan_studio_tester.conf:1):
# our keymap has no &studio_unlock key (and keymap content is frozen for
# Studio per docs - once Studio manages the keymap, .keymap edits stop
# applying), so a locked default would leave no physical unlock path.
# Unlock requests exist ONLY as a physical binding in v0.3.0 (no RPC
# unlock); with locking off the keyboard is always unlocked.
CONFIG_ZMK_STUDIO_LOCKING=n

# Attempt 51: v0.3.0 + nice!nano BLE pairing fix from upstream issue #3158:
# two users confirm pairing failures on v0.3.0/main with nice!nano resolve
# with 2M PHY disabled ("v0.3 enforces stricter Bluetooth protocols by
# default; older host stacks may be incompatible"). Our BLE pairing has
# failed on every build since A34 - all v0.3.0-based - which matches this
# signature. v0.3.0's own app/Kconfig flags this same knob:
# "default n if ZMK_BLE_EXPERIMENTAL_CONN". Advertising is unaffected
# (always 1M legacy), which is why the keyboard advertises but never pairs.
# If pairing works after this change, the 2M PHY negotiation is the root
# cause. Set in BOTH conf files (merge lesson).
CONFIG_BT_CTLR_PHY_2M=n

# Attempt 55: wipe all persistent settings (incl. stale v0.3.0-era NVS bonds)
# at every boot. Diagnostic for the A54 pairing test: the A54 attempt failed
# with the old bond table still loaded (UF2 flash does not touch the storage
# partition), so the keyboard may be pairing-accepting against stale keys.
# If pairing works with this on, stale bonds were the blocker; flip to =n in
# a follow-up commit once pairing is proven.
CONFIG_ZMK_SETTINGS_RESET_ON_START=y

# Attempt 47: bench instrumentation for the X-axis stutter investigation.
# Default OFF - flip to =y (BOTH conf files) for the raw-delta bench capture,
# then flip back. Logs "raw dx=<n> dy=<n>" ~every 64ms while moving.
# CONFIG_ADNS5050_DEBUG_DELTAS=n
